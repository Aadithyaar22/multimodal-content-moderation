# Cloud Build → Artifact Registry → Cloud Run.
#
# Cloud Run rather than Render because the free Render instance caps at 512MB and
# this service measures 690MB resident with every branch loaded. Cloud Run allows
# 2GB, so nothing has to be disabled to fit.

timeout: 2400s

options:
  # The default machine runs out of memory installing torch and baking the model
  # cache into the image.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 60
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-south1
  _SERVICE: vanguard-moderation-api
  _REPO: vanguard
  # SHORT_SHA (no underscore) is a *built-in* substitution that Cloud Build only
  # auto-populates for a trigger reading from a connected repo. A plain
  # `gcloud builds submit --config cloudbuild.yaml .` from local source — the
  # documented, and so far only, way this has been deployed — leaves it empty,
  # which produced a tag ending in a bare colon and failed docker's own argument
  # parsing before any build step ran. A user-defined substitution with a
  # default makes the documented one-liner work unmodified, while still letting
  # a real commit SHA be threaded through via
  # --substitutions=_SHORT_SHA=$(git rev-parse --short HEAD).
  _SHORT_SHA: manual

# Deliberately no top-level `images:` block. Those are pushed only after every
# step completes, so the deploy step would look for a tag that does not exist
# yet and fail with "image not found". The push is an explicit step instead,
# ordered before the deploy.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # 2GB fits every branch. The measured resident set is 690MB; the headroom
      # absorbs request-time allocations rather than being spare.
      - --memory=2Gi
      - --cpu=2
      # Scale to zero so an idle service costs nothing, and cap the ceiling so a
      # traffic spike or a loop cannot run up a bill on a real billing account.
      - --min-instances=0
      - --max-instances=3
      # Model load takes ~14s on CPU; the default 240s startup budget is ample,
      # but requests during it must not be dropped.
      - --timeout=120
      # One in-flight request per instance. Each holds CLIP plus six heads, and
      # concurrent requests on one instance contend for the same 2 vCPU.
      - --concurrency=4
      # --update-env-vars merges; --set-env-vars replaces the service's entire
      # environment. Every rebuild through this file used --set-env-vars here
      # for months, and it worked only by accident, because until this session
      # nothing else had ever been added to the service's environment. The
      # first time GEMINI_API_KEY and GEMINI_MODEL existed as manually-added
      # vars, a routine rebuild through this exact step silently deleted both
      # — with no error, and no symptom until the explanation endpoint was
      # actually exercised, because /health does not depend on that key. This
      # is the same replace-vs-merge mistake as giving a user a --set-env-vars
      # command for a service that already has vars worth keeping; it is worth
      # remembering that a CI/CD deploy step is exactly such a user, every time
      # it runs.
      - --update-env-vars=MCM_ALLOWED_ORIGIN_REGEX=https://.*\.vercel\.app
