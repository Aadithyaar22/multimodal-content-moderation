<script>
    // WebGL Shader Background setup
    const container = document.getElementById('shader-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
        uniform float uTime;
        uniform vec2 uResolution;
        varying vec2 vUv;

        // Noise functions (Simplex noise simplified)
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187,  // (3.0-sqrt(3.0))/6.0
                                0.366025403784439,  // 0.5*(sqrt(3.0)-1.0)
                               -0.577350269189626,  // -1.0 + 2.0 * C.x
                                0.024390243902439); // 1.0 / 41.0
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1;
            i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod289(i); // Avoid truncation effects in permutation
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m ;
            m = m*m ;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        void main() {
            vec2 st = gl_FragCoord.xy/uResolution.xy;
            st.y = 1.0 - st.y; // Flip Y to match CSS orientation (black top, white bottom)

            // Base gradient
            float baseMix = smoothstep(0.2, 0.8, st.y);
            
            // Add smoke/plumes in the middle
            float n = snoise(vec2(st.x * 2.0 + uTime * 0.1, st.y * 3.0 - uTime * 0.05));
            float n2 = snoise(vec2(st.x * 1.5 - uTime * 0.07, st.y * 2.0 + uTime * 0.03));
            
            // Mix noise into the boundary
            float boundaryMix = smoothstep(0.4, 0.6, st.y + n * 0.15 + n2 * 0.1);
            
            // Create the smoky plume effect in the center
            float centerMask = 1.0 - abs(st.y - 0.5) * 2.0; // 1 at center, 0 at edges
            centerMask = smoothstep(0.0, 0.8, centerMask);
            
            float smoke = (n * 0.5 + 0.5) * (n2 * 0.5 + 0.5) * centerMask;

            // Combine gradient and smoke
            vec3 colorTop = vec3(0.0, 0.0, 0.0);
            vec3 colorBottom = vec3(1.0, 1.0, 1.0);
            vec3 smokeColor = vec3(0.8, 0.8, 0.8); // Light grey smoke

            vec3 finalColor = mix(colorTop, colorBottom, boundaryMix);
            
            // Blend smoke into the transition area
            finalColor = mix(finalColor, mix(finalColor, smokeColor, smoke * 0.8), centerMask);

            gl_FragColor = vec4(finalColor, 1.0);
        }
    `;

    const uniforms = {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms,
        depthWrite: false,
        depthTest: false
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function animate(time) {
        requestAnimationFrame(animate);
        uniforms.uTime.value = time * 0.001;
        renderer.render(scene, camera);
    }

    animate(0);

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    });
</script>
