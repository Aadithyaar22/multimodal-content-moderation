# One-click backend deploy: https://render.com/deploy
#
# Render rather than HuggingFace Spaces because Spaces now requires a PRO
# subscription for Docker SDK; only static Spaces remain on the free tier.
#
# The free instance sleeps after inactivity and takes 30-50s to wake. That is
# why /health is cheap and unauthenticated and why the frontend polls it — a
# cold start surfaces as an explicit warming state rather than a hung request.

services:
  - type: web
    name: vanguard-moderation-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      # Measured: 690MB resident with the deepfake branch loaded, 473MB without,
      # against a 512MB limit on the free plan. The branch is therefore off by
      # default here — it is auxiliary, and its absence costs a "not_checked"
      # field rather than any part of the verdict. Set to "0" on a paid plan
      # (Starter is 2GB) to enable it.
      #
      # Even at 473MB this is 92% of the limit. If the service is OOM-killed
      # under load, the plan is the fix, not further trimming.
      - key: MCM_DISABLE_DEEPFAKE
        value: "1"
      # Set to the deployed frontend origin. Without it CORS blocks the browser.
      - key: MCM_ALLOWED_ORIGINS
        sync: false
      # Vercel gives each preview deployment its own subdomain, so previews are
      # matched by pattern rather than enumerated.
      - key: MCM_ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      # Optional. Absent, the LLM narrative reports "unavailable" and the
      # verdict is unaffected.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional. Absent, moderation records live in a bounded in-memory store.
      - key: MONGODB_URI
        sync: false
